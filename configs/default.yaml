# SMoEA Router default configuration
# 所有超參數與路徑的唯一定義處。指令列可用 --set key=value 覆蓋單項。
# 任務集合不在此列舉：ID 任務由掃描 dataset/train_data 自動推導，
# OOD 任務 = dataset/test_data 中有測試檔但無訓練檔的任務。

paths:
  dataset_dir: dataset            # 之下需有 train_data/ 與 test_data/
  assets_dir: assets              # build_router_assets 的輸出（嵌入快取、指紋、校準庫）
  results_dir: results            # 評測輸出 json

data:
  field: input                    # 上游相容欄位；routing_text=input 時使用
  routing_text: input             # 交付預設，與隨附資產一致；answer_free_full_prompt 需重新建置 assets
  doc_clip_chars: 3000            # 文本截斷長度（TF-IDF / BM25 / 裁決 prompt 共用）

embedding:
  model_name: BAAI/bge-large-en-v1.5
  batch_size: 64
  device: cuda                    # 無 GPU 時自動退回 cpu

split:                            # train 樣本切分（逐任務、種子固定）
  fractions: [0.8, 0.2]           # 指紋堆 / 校準堆（封板值；改動即無法復現封板資產）
  seed: 42

fingerprint:
  k_max: 8                        # 多質心上限
  min_silhouette: 0.08            # silhouette 低於此值不展開（k=1）
  sil_sample: 1000                # silhouette 抽樣上限（大任務加速）

units:
  sim_threshold: 0.97             # 指紋 cosine 相似度超過此值的任務併為路由單位

lexical:
  tfidf_max_features: 50000

thresholds:
  use_lexical: true               # 詞彙一致性訊號（ablation：false=關閉）                       # 四區分流的三條線 + 裁決線
  transfer_floor: 0.10            # margin 直判線：全域 unit margin 超過即直判路由
  p_lo: 0.02                      # 紅區線：conformal p 值低於此即拒絕（誤拒率預算）
  p_hi: 0.10                      # 送審上界：p 值在 [p_lo, p_hi) 進送審
  theta_verify: 0.5               # 送審裁決：LLM 是非題 yes 機率達此值才路由

verifier:
  model_path: unsloth/Meta-Llama-3.1-8B-Instruct # 免授權鏡像；可填本地路徑
  example_max_chars: 300
  checkpoint_every: 50            # 送審打分每 N 筆 flush 一次（可中斷續跑）

evaluation:
  ood_groundtruth: null           # 任務級人工標記 json 的路徑；null = 無標記模式
                                  # （無標記時 OOD 段輸出行為描述統計、不輸出 acc，
                                  #   overall 欄位取消、只報 ID acc）
  ood_top_routes: 3               # 無標記模式下 per-task 報告的路由去向數

system:                           # 主程式（main.py）：路由後的生成執行層
  base_model: unsloth/Meta-Llama-3.1-8B
  adapter_dir: adapter            # adapter/task{N}/（直含 adapter 檔或 checkpoint-*/ 取最新）
  rejection_method: null          # null 預設 base；
                                  # 也可明定 base | artifact | arrow | taskwise_k16_arrow
  rejection_artifact_dir: null    # artifact: prepare/merged_model 完整目錄
  rejection_router_dir: null      # Arrow: moea-repro 的 prepare/；Direct Arrow 可 null 現算
  rejection_adapter_manifest: null # Direct Arrow: 依序列出 150 adapters 的 manifest.json
  rejection_adapter_root: null    # manifest 相對 path 的根目錄；null 表示 manifest 所在目錄
  artifact_registry: artifacts/registry.json  # 可選拒絕方法的清單檔。預設就在 repo 下的
                                  # artifacts/（已列入 .gitignore），setup 準備好之後直接可用，
                                  # 不必每次用 --set 指定路徑。檔案不存在時只是沒有可選項目，
                                  # 不影響 rejection_method 指定的方法。掛載到別處時才覆蓋此項。
  artifact_root: artifacts        # 權重檔的落地根目錄；結構
                                  # <artifact_root>/<方法>/<run_id>/prepare/merged_model/
  load_in_4bit: false             # 生成模型量化；須與 MoEA-Trainer 訓練側載入設定一致
  dtype: float16
  max_input_tokens: 4096          # prompt 截斷長度（左 padding）
  max_new_tokens: 512             # 照 MoEA-Trainer inference 設定
  batch_size: 8                   # 批次模式生成 batch（單卡保守值；多卡可調 28）
  verifier_mode: resident_4bit    # 互動模式送審裁決：resident_4bit（裁決模型 4bit 常駐，
                                  #   與生成模型共存）| swap（分時載卸，慢但精度同封板）
                                  #   | off（無裁決，送審一律拒絕 fail-closed）
